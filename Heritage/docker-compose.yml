services:
  # Broker MQTT - Se encarga de recibir y distribuir los datos del ESP32
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mqtt_broker
    ports:
      - "1883:1883"   # Puerto estándar MQTT
      - "9001:9001"   # Puerto para WebSockets
    volumes:
      - ./mosquitto_config:/mosquitto/config
      - ./mosquitto_data:/mosquitto/data
      - ./mosquitto_log:/mosquitto/log
    restart: always

  # InfluxDB - Base de datos para almacenar datos de sensores con marca de tiempo
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb_data:/var/lib/influxdb2
    restart: always

  # Grafana - Plataforma para crear paneles de control (dashboards) en tiempo real
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - influxdb
    restart: always